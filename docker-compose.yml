services:
  db:
    image: mysql:8.4
    container_name: betterauth-vatsim-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: betterauth_vatsim
      MYSQL_USER: betterauth
      MYSQL_PASSWORD: betterauth
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - betterauth_vatsim_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  betterauth_vatsim_data:
